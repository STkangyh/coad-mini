name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 matches local development; 3.11 guards against relying on
        # anything newer than the oldest version we claim to support.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # The CPU wheel index keeps torch at ~200MB instead of pulling the CUDA
        # build. `av` and `uvicorn` are in requirements.txt but are not imported
        # at module scope, so the tests do not need them (av would also drag in
        # ffmpeg system libraries).
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install numpy Pillow fastapi python-multipart transformers httpx pytest

      - name: Run tests
        # data/features/ is gitignored, so a fresh checkout has no extracted
        # features -- app.py falls back to synthetic anomaly calibration, which
        # is the path this job is meant to exercise. Offline flags make a
        # surprise model download fail loudly instead of silently costing 600MB.
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest tests/ -q
